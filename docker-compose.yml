services:
  franka_ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}
    container_name: franka_ros2
    network_mode: "host"
    privileged: true
    command: /bin/bash
    tty: true
    stdin_open: true
    volumes:
      - ./:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./limits.conf:/etc/security/limits.conf
      - /dev:/dev
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      # Pin DDS to loopback: every ROS 2 node lives in this one container, and
      # the robot link is libfranka (not DDS), so discovery must not leak onto
      # the robot NIC or the LAN (other machines on the same WiFi run ROS 2 on
      # domain 0 and would merge into our graph).
      ROS_LOCALHOST_ONLY: 1
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
